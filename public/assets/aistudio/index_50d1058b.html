<script>
let allDraws = [];
let sorteos = [];
let pools = [];
let chartVisibility = { final: true, p2: true, p3: true, p4: true, p5: true, p6: true, p7: true };
let lastRecentDraws = [];

function toggleChartPool(id) {
    chartVisibility[id] = !chartVisibility[id];
    if (lastRecentDraws.length > 0) {
        renderAccuracyChart(lastRecentDraws);
    }
}

const WHEELING_SIZES = { 12: 12, 24: 24, 36: 36, 48: 48 };
function uv(k){ return WHEELING_SIZES[k] || 48; }
function gf(n,k){let r=1;for(let i=1;i<=k;i++)r=r*(n-i+1)/i;return Math.round(r)}

function getRow(n) {
    if (n <= 7) return 1;
    if (n <= 14) return 2;
    if (n <= 21) return 3;
    return 4;
}

function isValidCombo(combo, poolSlice = null, poolId = '') {
    const sorted = [...combo].sort((a,b) => a-b);
    let maxConsec = 1, currentConsec = 1;
    for (let i = 1; i < sorted.length; i++) {
        if (sorted[i] === sorted[i-1] + 1) {
            currentConsec++;
            if (currentConsec > maxConsec) maxConsec = currentConsec;
        } else {
            currentConsec = 1;
        }
    }
    if (maxConsec > 3) return false;
    if (combo.filter(n => n % 2 === 0).length > 3) return false;
    if (combo.filter(n => n % 2 !== 0).length > 3) return false;
    const primes = [2, 3, 5, 7, 11, 13, 17, 19, 23];
    if (combo.filter(n => primes.includes(n)).length > 3) return false;
    
    if (poolId !== 'p6' && poolId !== 'p7') {
        const rows = combo.map(n => getRow(n));
        const rowCounts = { 1: 0, 2: 0, 3: 0, 4: 0 };
        rows.forEach(r => rowCounts[r]++);
        if (rowCounts[1] >= 3 || rowCounts[2] >= 3 || rowCounts[3] >= 3 || rowCounts[4] >= 3) {
            return false;
        }

        if (poolSlice && poolSlice.length >= 21) {
            const topRow = poolSlice.slice(0, 7);
            const midRow = poolSlice.slice(7, 14);
            const botRow = poolSlice.slice(14, 21);
            if (combo.filter(n => topRow.includes(n)).length >= 3 ||
                combo.filter(n => midRow.includes(n)).length >= 3 ||
                combo.filter(n => botRow.includes(n)).length >= 3) {
                return false;
            }
        }
    }

    const sum = combo.reduce((a, b) => a + b, 0);
    if (sum < 38 || sum > 108) return false;
    return true;
}

function Ef(e, n) {
    let t = e.length, r = new Set(), l = [];
    if (t < 7) return [];
    let u = t - 6;
    for (let i = 0; i < n; i++) {
        let o = 0, a = false;
        while (o < n * 4 && !a) {
            let c = i + o * n, m = c * 2 % 6, g = (c * 3 + 1) % 6;
            if (g === m) g = (g + 1) % 6;
            let y = 6 + c * 5 % u, k = 6 + (c * 7 + 2) % u;
            if (k === y) k = 6 + (k - 6 + 1) % u;
            let w = 6 + (c * 11 + 5) % u, counter = 0;
            while ((w === y || w === k) && counter < u + 5) {
                w = 6 + (w - 6 + 1) % u;
                counter++;
            }
            let combo = [e[m], e[g], e[y], e[k], e[w]].sort((d, S) => d - S);
            if (new Set(combo).size < 5) { o++; continue; }
            let f = combo.join(",");
            if (!r.has(f)) { r.add(f); l.push(combo); a = true; } else { o++; }
        }
        if (!a) {
            let c = 0;
            while (c < 100 && !a) {
                let m = i * 13 + c * 17 + 3, g = m * 2 % 6, y = (m * 3 + 1) % 6;
                if (y === g) y = (y + 2) % 6;
                let k = 6 + (m * 5 + c) % u, w = 6 + (m * 7 + 2 + c * 2) % u;
                if (w === k) w = 6 + (w - 6 + 1) % u;
                let lastIdx = 6 + (m * 11 + 5 + c * 3) % u, counter2 = 0;
                while ((lastIdx === k || lastIdx === w) && counter2 < u + 5) {
                    lastIdx = 6 + (lastIdx - 6 + 1) % u;
                    counter2++;
                }
                let h = [e[g], e[y], e[k], e[w], e[lastIdx]].sort((d, S) => d - S);
                let f = h.join(",");
                if (!r.has(f) && new Set(h).size === 5) { r.add(f); l.push(h); a = true; }
                c++;
            }
        }
    }
    return l.sort((i, o) => { for (let a = 0; a < 5; a++) if (i[a] !== o[a]) return i[a] - o[a]; return 0; }).slice(0, n);
}

function rv(e, n, t, poolId = '') {
    let baseCombos = generateWheelingWithFilters(e, t, poolId);
    if (n && n.length > 0) {
        return baseCombos.sort((c1, c2) => {
            let h1 = c1.filter(k => n.includes(k)).length;
            let h2 = c2.filter(k => n.includes(k)).length;
            if (h2 !== h1) return h2 - h1;
            for (let i = 0; i < 5; i++) {
                if (c1[i] !== c2[i]) return c1[i] - c2[i];
            }
            return 0;
        });
    }
    return baseCombos;
}

function generateWheelingWithFilters(nums, targetCount, poolId = '') {
    const candidates = Ef(nums, Math.max(targetCount * 4, 120));
    const valid = candidates.filter(c => isValidCombo(c, nums, poolId));
    const result = [];
    const seen = new Set();
    
    for (const c of valid) {
        if (result.length >= targetCount) break;
        let k = c.join(',');
        if (!seen.has(k)) { seen.add(k); result.push(c); }
    }
    
    for (const c of candidates) {
        if (result.length >= targetCount) break;
        let k = c.join(',');
        if (!seen.has(k)) { seen.add(k); result.push(c); }
    }
    
    let a = 0;
    while (result.length < targetCount && a < nums.length) {
        let c = nums.slice(a, a + 5);
        if (c.length === 5) {
            let m = [...c].sort((x, y) => x - y);
            let k = m.join(',');
            if (!seen.has(k)) { seen.add(k); result.push(m); }
        }
        a++;
    }

    while (result.length < targetCount) {
        let combo = [];
        let seed = result.length * 13 + 3;
        while (combo.length < 5) {
            let idx = (seed + combo.length * 7) % nums.length;
            let val = nums[idx];
            if (!combo.includes(val)) combo.push(val);
            seed++;
        }
        combo.sort((x, y) => x - y);
        let k = combo.join(',');
        if (!seen.has(k)) {
            seen.add(k);
            result.push(combo);
        } else {
            let added = false;
            for (let n of nums) {
                if (!combo.includes(n)) {
                    let nc = [...combo.slice(0, 4), n].sort((x, y) => x - y);
                    let nk = nc.join(',');
                    if (!seen.has(nk)) { seen.add(nk); result.push(nc); added = true; break; }
                }
            }
            if (!added) {
                let nc = [...combo];
                nc[0] = (nc[0] % 28) + 1;
                nc.sort((x, y) => x - y);
                let nk = nc.join(',');
                seen.add(nk);
                result.push(nc);
            }
        }
    }

    return result.slice(0, targetCount);
}

function parseCSV(text) {
    const lines = text.trim().split('\n');
    const draws = [];
    for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',');
        if (cols.length >= 8) {
            draws.push({
                num: parseInt(cols[0]),
                win: [parseInt(cols[2]), parseInt(cols[3]), parseInt(cols[4]), parseInt(cols[5]), parseInt(cols[6])],
                date: cols[7]
            });
        }
    }
    return draws.sort((a, b) => a.num - b.num);
}

function calculateMLPools(draws) {
    const lastDraw = draws[draws.length - 1].win;
    const prevDraw = draws[draws.length - 2].win;
    const window50 = draws.slice(-50).map(d => d.win);
    
    let scores = [];
    for (let i = 1; i <= 28; i++) {
        let freq = 0;
        window50.forEach(d => { if (d.includes(i)) freq++; });
        let gap = 0;
        for (let j = draws.length - 1; j >= Math.max(0, draws.length - 50); j--) {
            if (draws[j].win.includes(i)) { gap = draws.length - 1 - j; break; }
        }
        let coOccur = 0;
        draws.slice(-20).forEach(d => {
            if (d.win.includes(i) && lastDraw.some(ld => d.win.includes(ld))) coOccur++;
        });
        let score = (freq * 2.5) + (coOccur * 3.5) + (gap > 0 && gap <= 15 ? gap * 0.8 : 0);
        if (lastDraw.includes(i) || prevDraw.includes(i)) score -= 20;
        scores.push({ num: i, score, freq, gap, coOccur });
    }

    scores.sort((a, b) => a.score - b.score);
    const antiPool = scores.slice(0, 5).map(s => s.num);

    scores.sort((a, b) => b.score - a.score);

    const p2 = [...scores].sort((a, b) => b.score - a.score).slice(0, 21).map(s => s.num);
    const p3 = [...scores].sort((a, b) => b.gap - a.gap).slice(0, 21).map(s => s.num);
    const p4 = [...scores].sort((a, b) => b.coOccur - a.coOccur).slice(0, 21).map(s => s.num);
    const p5 = [...scores].sort((a, b) => (b.freq * 1.5 + (28 - b.gap)) - (a.freq * 1.5 + (28 - a.gap))).slice(0, 21).map(s => s.num);
    const p6 = [...scores].sort((a, b) => (b.coOccur * 2 + b.freq) - (a.coOccur * 2 + a.freq)).slice(0, 21).map(s => s.num);

    let allPoolsList = [p2, p3, p4, p5, p6];
    let candidateFinal = Array.from(new Set([...p4, ...p2, ...p3, ...p5, ...p6]));
    candidateFinal.sort((a, b) => {
        let freqA = allPoolsList.filter(p => p.includes(a)).length;
        let freqB = allPoolsList.filter(p => p.includes(b)).length;
        if (freqB !== freqA) return freqB - freqA;
        let scoreA = scores.find(s => s.num === a)?.score || 0;
        let scoreB = scores.find(s => s.num === b)?.score || 0;
        return scoreB - scoreA;
    });
    const finalPool = candidateFinal.slice(0, 21);

    let middleRowsList = [
        finalPool.slice(7, 14),
        p2.slice(7, 14),
        p3.slice(7, 14),
        p4.slice(7, 14),
        p5.slice(7, 14),
        p6.slice(7, 14)
    ];
    
    let middleFreqMap = {};
    middleRowsList.forEach(row => {
        row.forEach(n => {
            middleFreqMap[n] = (middleFreqMap[n] || 0) + 1;
        });
    });

    let candidatePool7 = Object.keys(middleFreqMap).map(Number);
    candidatePool7.sort((a, b) => {
        let fA = middleFreqMap[a];
        let fB = middleFreqMap[b];
        if (fB !== fA) return fB - fA;
        let scoreA = scores.find(s => s.num === a)?.score || 0;
        let scoreB = scores.find(s => s.num === b)?.score || 0;
        return scoreB - scoreA;
    });

    scores.forEach(s => {
        if (candidatePool7.length < 21 && !candidatePool7.includes(s.num)) {
            candidatePool7.push(s.num);
        }
    });

    const p7 = candidatePool7.slice(0, 21);

    return { final: finalPool, anti: antiPool, p2, p3, p4, p5, p6, p7 };
}

function savePredictionIfNotExists(concurso, draws) {
    const key = 'chispazo_pred_v7_' + concurso;
    const saved = localStorage.getItem(key);
    if (saved) {
        return JSON.parse(saved);
    }
    const idx = draws.findIndex(d => d.num === concurso);
    if (idx <= 0) return null;
    const histDraws = draws.slice(0, idx);
    const pred = calculateMLPools(histDraws);
    const toSave = { final: pred.final, p2: pred.p2, p3: pred.p3, p4: pred.p4, p5: pred.p5, p6: pred.p6, p7: pred.p7 };
    localStorage.setItem(key, JSON.stringify(toSave));
    return toSave;
}

function getPrediction(concurso, draws) {
    const key = 'chispazo_pred_v7_' + concurso;
    const saved = localStorage.getItem(key);
    if (saved) return JSON.parse(saved);
    return savePredictionIfNotExists(concurso, draws);
}

function getNextDrawTime(draws) {
    if (!draws || draws.length === 0) return '3pm';
    const last = draws[draws.length - 1];
    const drawsOnDate = draws.filter(d => d.date === last.date);
    if (drawsOnDate.length >= 2) {
        drawsOnDate.sort((a, b) => a.num - b.num);
        if (last.num === drawsOnDate[0].num) {
            return '9pm';
        } else {
            return '3pm';
        }
    }
    return last.num % 2 === 0 ? '3pm' : '9pm';
}

async function init() {
    try {
        let csvText = localStorage.getItem('chispazo_csv_cache');
        
        try {
            const savedCache = localStorage.getItem('chispazo_hitcache_v4');
            if (savedCache) {
                Object.assign(hitCache, JSON.parse(savedCache));
            }
        } catch(e){}

        if (csvText) {
            allDraws = parseCSV(csvText);
            sorteos = allDraws.slice(-20);
            
            const last = allDraws[allDraws.length - 1];
            const nextNum = last.num + 1;
            const drawTime = getNextDrawTime(allDraws);
            document.getElementById('next-draw-info').innerHTML = 'Próximo Sorteo: <b>' + nextNum + ' (' + drawTime + ')</b> • Basado en Sorteo ' + last.num + ' (' + last.date + ')';
            document.getElementById('current-pool-title').innerText = 'Predicción Sorteo ' + nextNum + ' (' + drawTime + ')';
            
            const livePools = calculateMLPools(allDraws);

function hitsCount(a, w) { 
    if (!a || !Array.isArray(a) || !w) return 0;
    return a.filter(n => w.includes(n)).length; 
}
function hitClass(c) { if (c >= 5) return 'hit-5'; if (c === 4) return 'hit-4'; if (c === 3) return 'hit-3'; return 'hit-0'; }

const hitCache = {};

function getPoolWheelingsMaxHits(poolNums, win, poolId) {
    let has4 = false;
    let has5 = false;
    if (!poolNums || !win) return { has4, has5 };
    const wheelingConfigs = [
        {k: 12, slice: poolNums.slice(0, 12)},
        {k: 24, slice: poolNums.slice(0, 16)},
        {k: 36, slice: poolNums.slice(0, 18)},
        {k: 48, slice: poolNums}
    ];
    for (const w of wheelingConfigs) {
        const reduced = uv(w.k);
        const combos = rv(w.slice, win, reduced, poolId);
        for (const c of combos) {
            const h = c.filter(n => win.includes(n)).length;
            if (h === 4) has4 = true;
            if (h >= 5) has5 = true;
        }
    }
    return { has4, has5 };
}

function getPoolHitCellHtml(sNum, pid, poolNums, win) {
    const cacheKey = sNum + '_' + pid;
    let hitInfo;
    if (hitCache[cacheKey]) {
        hitInfo = hitCache[cacheKey];
    } else {
        hitInfo = getPoolWheelingsMaxHits(poolNums, win, pid);
        hitCache[cacheKey] = hitInfo;
        try {
            localStorage.setItem('chispazo_hitcache_v4', JSON.stringify(hitCache));
        } catch(e){}
    }

    const h = hitsCount(poolNums, win);
    let cellText = h + '/21';
    
    let leftStar = hitInfo.has4 ? '<span style="color:#00e676;font-size:10px;margin-right:2px;vertical-align:middle;text-shadow:0 0 4px #00e676;" title="Wheeling con 4 aciertos">★</span>' : '';
    let rightStar = hitInfo.has5 ? '<span style="color:#b388ff;font-size:10px;margin-left:2px;vertical-align:middle;text-shadow:0 0 4px #7c4dff;" title="Wheeling con 5 aciertos">★</span>' : '';
    
    return leftStar + cellText + rightStar;
}

function renderAccuracyChart(recentDraws) {

        {id: 'p2', name: 'Pool2', color: '#00e5ff'},

        {id: 'p5', name: 'Pool5', color: '#e040fb'},
        {id: 'p6', name: 'Pool6', color: '#26c6da'},
        {id: 'p7', name: 'Pool7', color: '#ff4081'}
    ];
    
    let dataset = poolKeys.map(pk => {
        let hitsArr = draws20.map(s => {
            const key = 'chispazo_pred_v7_' + s.num;
            const saved = localStorage.getItem(key);
            let pred = null;
            if (saved) { try { pred = JSON.parse(saved); } catch(e){} }
            if (!pred) {
                const idx = allDraws.findIndex(d => d.num === s.num);
                if (idx > 0) {
                    pred = calculateMLPools(allDraws.slice(0, idx));
                }
            }
            if (!pred) return 0;
            let poolNums = pred[pk.id === 'final' ? 'final' : pk.id];
            return hitsCount(poolNums, s.win);
        });
        return { ...pk, hits: hitsArr };
    });

    const svgWidth = 980;
    const svgHeight = 220;
    const padding = { top: 20, right: 20, bottom: 30, left: 35 };
    const chartWidth = svgWidth - padding.left - padding.right;
    const chartHeight = svgHeight - padding.top - padding.bottom;

    const numPoints = draws20.length;
    const dx = chartWidth / Math.max(1, numPoints - 1);

    let svg = '<svg viewBox="0 0 ' + svgWidth + ' ' + svgHeight + '" style="width:100%;height:auto;background:#141414;border-radius:8px">';
    
    for (let h = 0; h <= 5; h++) {
        let y = padding.top + (chartHeight / 5) * (5 - h);
        svg += '<line x1="' + padding.left + '" y1="' + y + '" x2="' + (svgWidth - padding.right) + '" y2="' + y + '" stroke="#2a2a2a" stroke-width="1" />';
        svg += '<text x="' + (padding.left - 6) + '" y="' + (y + 4) + '" fill="#888" font-size="9" text-anchor="end">' + h + 'ac</text>';
    }

    draws20.forEach((s, idx) => {
        let x = padding.left + idx * dx;
        if (idx % 2 === 0 || numPoints <= 10) {
            svg += '<text x="' + x + '" y="' + (svgHeight - 10) + '" fill="#777" font-size="8" text-anchor="middle">' + s.num + '</text>';
        }
    });

    dataset.forEach(ds => {
        if (!chartVisibility[ds.id]) return;
        let points = ds.hits.map((h, idx) => {
            let x = padding.left + idx * dx;
            let y = padding.top + chartHeight - (h / 5) * chartHeight;
            return x + ',' + y;
        }).join(' ');

        svg += '<polyline fill="none" stroke="' + ds.color + '" stroke-width="2" points="' + points + '" />';
        
        ds.hits.forEach((h, idx) => {
            let x = padding.left + idx * dx;
            let y = padding.top + chartHeight - (h / 5) * chartHeight;
            svg += '<circle cx="' + x + '" cy="' + y + '" r="3.5" fill="' + ds.color + '"><title>Sorteo ' + draws20[idx].num + ': ' + ds.name + ' (' + h + ' aciertos)</title></circle>';

function openWheeling(id, k, sorteoNum) {
    let pBase = pools.find(x => x.id === id);
    let slice = [];
    
    if (sorteoNum) {
        const pred = getPrediction(sorteoNum, allDraws);
        if (pred) {
            slice = pred[id === 'final' ? 'final' : id];
        }
    }
    if (slice.length === 0) slice = pBase.nums;

    let p = { ...pBase, nums: slice, wheelings: [{k:12, slice:slice.slice(0,12)}, {k:24, slice:slice.slice(0,16)}, {k:36, slice:slice.slice(0,18)}, {k:48, slice:slice}] };
    let w = p.wheelings.find(x => x.k === k);
    if (!w) return;

    let total = gf(slice.length, 5);
    let reduced = uv(k);
    let win = null, winDate = '';
    if (sorteoNum) {
        let s = allDraws.find(x => x.num === sorteoNum);
        if (s) { win = s.win; winDate = s.date; }
    }

    let combos = win ? rv(slice, win, reduced, p.id) : generateWheelingWithFilters(slice, reduced, p.id);
    
    let winHtml = '';

        winHtml = '<div style="background:var(--yellow);color:black;border-radius:10px;padding:10px;text-align:center;box-shadow:0 0 20px #ffeb3b44"><div style="font-size:10px;font-weight:900;letter-spacing:0.05em">● GANADORES REALES - SORTEO ' + sorteoNum + '</div><div style="font-size:20px;font-weight:900;letter-spacing:0.08em;margin:2px 0">' + win.map(n => String(n).padStart(2, '0')).join(' ') + '</div><div style="font-size:10px;opacity:0.9">' + winDate + '</div><div style="margin-top:6px"><span style="background:#7c4dff;color:white;border-radius:999px;padding:3px 10px;font-size:10px;font-weight:900">Mejor ' + Math.max(...combos.map(c => c.filter(n => win.includes(n)).length)) + ' aciertos</span></div></div>';

        let bg = win ? (hits === 5 ? '#7c4dff' : hits === 4 ? '#2e7d32' : '#1a1a1a') : '#1a1a1a';
        let border = win ? (hits === 5 ? '#b388ff' : hits === 4 ? '#4caf50' : '#333') : '#333';
        return '<div style="display:flex;gap:6px;align-items:center;padding:5px 8px;margin:3px 0;background:' + (i === 0 && win && hits >= 4 ? 'rgba(124,77,255,0.12)' : bg) + ';border:1px solid ' + border + ';border-radius:8px"><span style="font-size:10px;background:#222;border:1px solid #333;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-weight:800">' + (i + 1) + '</span><div style="display:flex;gap:3px">' + c.map(n => { let isWin = win ? win.includes(n) : false; return '<span style="background:' + (isWin ? (hits === 5 ? '#7c4dff' : '#2e7d32') : '#222') + ';border:1px solid ' + (isWin ? (hits === 5 ? '#b388ff' : '#4caf50') : '#333') + ';color:' + (isWin ? 'white' : '#ccc') + ';border-radius:5px;padding:2px 5px;font-size:11px;font-weight:900">' + String(n).padStart(2, '0') + '</span>'; }).join('') + '</div><span style="margin-left:auto;background:' + (hits === 5 ? '#7c4dff' : hits === 4 ? '#2e7d32' : '#424242') + ';color:white;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900">' + (win ? hits + ' ac' : '') + '</span></div>';
    }).join('');

    let htmlModal = '<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="modal-header" style="padding:10px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center"><span style="font-size:10px;font-weight:800" class="mono">Wheeling Pool ' + (p.id === 'final' ? 'FINAL' : p.id.toUpperCase()) + ' - ' + reduced + ' comb</span><button onclick="closeModal()" style="background:#2a2a2a;border:1px solid #555;color:white;border-radius:50%;width:26px;height:26px;cursor:pointer">×</button></div><div class="modal-scroll">' + winHtml + poolBaseHtml + statsHtml + '<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;font-weight:800">' + reduced + ' combinaciones - 5 números c/u</span><span class="pill" style="background:' + p.border + '22;border:1px solid ' + p.border + '66;color:' + p.accent + ';font-size:10px">Sorteo ' + (sorteoNum || 'Próximo') + '</span></div><div style="margin-top:8px">' + listHtml + '</div></div></div><div class="modal-footer" style="padding:8px;background:#0f0f0f;border-top:1px solid #222;display:flex;gap:8px;justify-content:center"><button onclick="copyWheelingToClipboard(\'' + id + '\',' + k + ',' + (sorteoNum || 0) + ')" style="background:#222;border:1px solid #444;color:#ccc;border-radius:999px;padding:6px 14px;font-size:11px;cursor:pointer">Copiar</button><button onclick="closeModal()" style="background:#1a1a1a;border:1px solid #333;color:#888;border-radius:999px;padding:6px 14px;font-size:11px;cursor:pointer">Cerrar [Esc]</button></div></div></div>';
    document.getElementById('modal-root').innerHTML = htmlModal;
}

function openCellPopout(num, pid, isHistorical) {
    let s = sorteos.find(x => x.num === num);
    if (!s) return;
    let pBase = pools.find(x => x.id === pid);
    let win = s.win;
    let poolNums = pBase.nums;
    
    if (isHistorical) {
        const key = 'chispazo_pred_v7_' + num;
        const saved = localStorage.getItem(key);
        let pred = null;
        if (saved) {
            try { pred = JSON.parse(saved); } catch (e) {}
        }
        if (!pred) {
            const idx = allDraws.findIndex(d => d.num === num);
            if (idx > 0) {
                const histDraws = allDraws.slice(0, idx);
                pred = calculateMLPools(histDraws);
                localStorage.setItem(key, JSON.stringify({ final: pred.final, p2: pred.p2, p3: pred.p3, p4: pred.p4, p5: pred.p5, p6: pred.p6, p7: pred.p7 }));
            }
        }
        if (pred) poolNums = pred[pid === 'final' ? 'final' : pid];
    }
    
    let p = { ...pBase, nums: poolNums, count: poolNums.length, wheelings: [{k:12, slice:poolNums.slice(0,12)}, {k:24, slice:poolNums.slice(0,16)}, {k:36, slice:poolNums.slice(0,18)}, {k:48, slice:poolNums}] };
    let ph = win.filter(n => poolNums.includes(n));
    let isFive = ph.length === 5;
    
    let grid = poolNums.map(n => {
        let isWin = win.includes(n);
        let bg = isWin ? (isFive ? '#7c4dff' : '#2e7d32') : 'var(--card)';
        let border = isWin ? (isFive ? '#b388ff' : '#4caf50') : '#333';
        let color = isWin ? 'white' : p.accent;
        let shadow = isWin ? 'box-shadow:0 0 8px ' + (isFive ? '#7c4dff' : '#2e7d32') + ';' : '';
        return '<div class="num-cell" style="background:' + bg + ';border-color:' + border + ';color:' + color + ';' + shadow + '">' + String(n).padStart(2, '0') + '</div>';
    }).join('');
    
    let wr = '';
    p.wheelings.forEach(w => {
        let reduced = uv(w.k);
        let combos = win ? rv(w.slice, win, reduced, p.id) : generateWheelingWithFilters(w.slice, reduced, p.id);
        let sc = combos.map(c => ({c, h: hitsCount(c, win)})).sort((a, b) => b.h - a.h);
        let best = sc[0] ? sc[0].h : 0;
        let top = sc.filter(x => x.h >= 2).slice(0, 3);
        let premio = best === 5 ? 'PREMIO 5!' : best === 4 ? 'PREMIO 4!' : '';
        let badgeColor = best === 5 ? '#7c4dff' : best === 4 ? '#2e7d32' : '#424242';
        
        let bt = '';
        if (top.length > 0) {
            bt = top.map((it, idx) => {
                let bg = idx === 0 ? 'rgba(124,77,255,0.12)' : 'transparent';
                let border = idx === 0 ? '1px solid #7c4dff44' : '0';
                let nums = it.c.map(n => {
                    let isWin = win.includes(n);
                    let bg = isWin ? (it.h === 5 ? '#7c4dff' : '#2e7d32') : '#1a1a1a';
                    let border = isWin ? (it.h === 5 ? '#b388ff' : '#4caf50') : '#333';
                    let color = isWin ? 'white' : '#ccc';
                    return '<span style="background:' + bg + ';border:1px solid ' + border + ';color:' + color + ';border-radius:4px;padding:2px 4px;font-size:11px;font-weight:800">' + String(n).padStart(2, '0') + '</span>';
                }).join('');
                let badgeBg = it.h >= 5 ? '#7c4dff' : it.h === 4 ? '#2e7d32' : '#424242';
                return '<div style="display:flex;gap:4px;align-items:center;margin:4px 0;background:' + bg + ';border:' + border + ';border-radius:6px;padding:3px"><span style="font-size:10px;background:#222;border:1px solid #333;border-radius:4px;padding:1px 4px;min-width:16px;text-align:center">' + (idx + 1) + '</span><div style="display:flex;gap:2px">' + nums + '</div><span style="margin-left:auto;background:' + badgeBg + ';color:white;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900">' + it.h + ' ac</span></div>';
            }).join('');
        } else {
            bt = '<div style="font-size:10px;color:#666;padding:4px">Sin combinaciones con 2+ aciertos</div>';
        }
        
        let border = best >= 4 ? '#7c4dff66' : '#2a2a2a';
        let bg = best >= 5 ? 'rgba(124,77,255,0.08)' : '#1a1a1a';
        let color = best >= 4 ? '#a5d6a7' : '#888';
        
        wr += '<div style="margin-top:12px;border:1px solid ' + border + ';border-radius:10px;padding:8px;background:' + bg + '"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;font-weight:900;color:' + p.accent + ';border:1px solid ' + p.border + '66;background:' + p.border + '22;padding:2px 8px;border-radius:999px">' + uv(w.k) + ' comb</span><div style="display:flex;gap:6px;align-items:center"><span style="font-size:10px;font-weight:800;color:' + color + '">Mejor ' + best + ' aciertos</span>' + (premio ? '<span style="background:' + badgeColor + ';color:white;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900">' + premio + '</span>' : '') + '</div></div>' + bt + '<div style="text-align:center;margin-top:8px"><button onclick="openWheeling(\'' + p.id + '\',' + w.k + ',' + s.num + ')" style="background:#222;border:1px solid #333;color:#aaa;border-radius:999px;padding:4px 12px;font-size:10px;cursor:pointer">Ver Wheeling Completo ↗</button></div></div>';
    });

    let headerBg = ph.length === 5 ? '#7c4dff' : 'var(--yellow)';
    let headerColor = ph.length === 5 ? 'white' : 'black';
    let headerShadow = ph.length === 5 ? '#7c4dff66' : '#ffeb3b44';
    let pillBg = ph.length === 5 ? '#7c4dff' : ph.length === 4 ? '#2e7d32' : '#333';
    let poolLabel = p.id === 'final' ? 'FINAL' : p.id.toUpperCase();
    
    let html = '<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="modal-header" style="padding:10px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;font-weight:900">Sorteo ' + s.num + ' - ' + p.label + '</span><button onclick="closeModal()" style="background:#2a2a2a;border:1px solid #555;color:white;border-radius:50%;width:26px;height:26px;cursor:pointer">×</button></div><div class="modal-scroll"><div style="background:' + headerBg + ';color:' + headerColor + ';border-radius:10px;padding:10px;text-align:center;box-shadow:0 0 20px ' + headerShadow + '"><div style="font-size:10px;font-weight:900;letter-spacing:0.05em">● GANADORES REALES</div><div style="font-size:20px;font-weight:900;letter-spacing:0.08em;margin:2px 0">' + win.map(n => String(n).padStart(2, '0')).join(' ') + '</div><div style="font-size:10px;opacity:0.9">' + s.date + '</div></div><div style="margin-top:12px;border:1px solid ' + p.border + '66;border-radius:10px;padding:10px;background:#1a1a1a"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;font-weight:900;color:' + p.accent + '">POOL ' + poolLabel + ' - ' + ph.length + ' aciertos</span><span class="pill" style="background:' + pillBg + ';color:white;border:0;font-size:11px;font-weight:900;padding:4px 10px">' + ph.length + '/' + p.count + '</span></div><div class="num-grid" style="margin-top:8px">' + grid + '</div></div><div style="margin-top:12px"><div style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:' + p.accent + ';display:inline-block"></span><span style="font-size:11px;font-weight:900;color:' + p.accent + '">WHEELINGS - RESULTADOS</span></div>' + wr + '</div></div><div class="modal-footer" style="padding:8px;background:#0f0f0f;border-top:1px solid #222;display:flex;justify-content:space-between;align-items:center"><button onclick="closeModal()" style="background:#222;border:1px solid #444;color:#ccc;border-radius:999px;padding:4px 12px;font-size:10px;cursor:pointer">CERRAR [Esc]</button></div></div></div>';
    
    document.getElementById('modal-root').innerHTML = html;
}

function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

function openBacktest() {
    document.getElementById('modal-root').innerHTML = '<div class="modal-bg" onclick="closeModal()"><div class="modal" style="height:auto;max-height:80vh"><div class="modal-header" style="padding:12px;display:flex;justify-content:space-between"><b style="font-size:12px;color:var(--cyan)">Backtesting: Ventana Móvil de 200 sorteos</b><button onclick="closeModal()" style="background:#2a2a2a;border:1px solid #444;color:white;border-radius:999px;padding:2px 8px">X</button></div><div class="modal-scroll"><div class="mono" style="font-size:10px;color:#aaa;padding:12px">El modelo fusionado utiliza una ventana móvil de 200 sorteos para calcular frecuencias, gaps, co-ocurrencias, ciclos y matrices probabilísticas. La Selección Restringida garantiza que los números finales no se solapen.<br><br>✅ Anti-Pool activo: Excluye automáticamente los 5 números con mayor probabilidad de NO salir.<br>✅ Inmutabilidad: Las predicciones de sorteos pasados se guardan en localStorage y nunca cambian.<br>✅ Filtros de calidad: Los wheelings excluyen combinaciones con >3 consecutivos, >3 pares/nones/primos, o suma fuera de 38-108.</div></div></div></div>';
}

function downloadTXT() {
    try {
        let sorteoNum = sorteos.length > 0 ? sorteos[sorteos.length - 1].num + 1 : 99999;
        let lines = ['CHISPAZO PREDICTOR V4 ML - Sorteo ' + sorteoNum, ''];
        pools.filter(p => p.id !== 'anti').forEach(function (p) {
            p.wheelings.forEach(function (w) {
                let combos = generateWheelingWithFilters(w.slice, uv(w.k));
                lines.push('POOL:' + p.id + ' COMBS:' + uv(w.k) + ' BASE:' + w.slice.join(',') + ' TOTAL:' + combos.length);
                combos.forEach(function (c, i) {
                    lines.push((i + 1) + ':' + c.map(function (n) { return String(n).padStart(2, '0'); }).join('-'));
                });
                lines.push('');
            });
        });
        let blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url;
        a.download = sorteoNum + '.txt';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1200);
    } catch (e) { alert('Error txt: ' + e.message); }
}

function downloadCSV() {
    try {
        let sorteoNum = sorteos.length > 0 ? sorteos[sorteos.length - 1].num + 1 : 99999;
        let rows = ['sorteo,pool,combinations,combo_num,n1,n2,n3,n4,n5'];
        pools.filter(p => p.id !== 'anti').forEach(function (p) {
            p.wheelings.forEach(function (w) {
                let combos = generateWheelingWithFilters(w.slice, uv(w.k));
                combos.forEach(function (c, i) {
                    rows.push([sorteoNum, p.id, uv(w.k), i + 1, c[0], c[1], c[2], c[3], c[4]].join(','));
                });
            });
        });
        let blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url;
        a.download = sorteoNum + '.csv';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1200);
    } catch (e) { alert('Error csv: ' + e.message); }
}

function showToast(msg) {
    let existing = document.getElementById('app-toast');
    if (existing) existing.remove();
    let toast = document.createElement('div');
    toast.id = 'app-toast';
    toast.style.position = 'fixed';
    toast.style.bottom = '24px';
    toast.style.left = '50%';
    toast.style.transform = 'translateX(-50%)';
    toast.style.background = '#7c4dff';
    toast.style.color = 'white';
    toast.style.padding = '10px 20px';
    toast.style.borderRadius = '999px';
    toast.style.fontSize = '12px';
    toast.style.fontWeight = '900';
    toast.style.boxShadow = '0 4px 20px rgba(124,77,255,0.5)';
    toast.style.zIndex = '99999';
    toast.style.transition = 'opacity 0.3s ease';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, 2200);
}

function copyWheelingToClipboard(id, k, sorteo) {
    let pBase = pools.find(x => x.id === id);
    let slice = [];
    let win = null;
    if (sorteo) {
        const pred = getPrediction(sorteo, allDraws);
        if (pred) {
            slice = pred[id === 'final' ? 'final' : id];
        }
        let s = allDraws.find(x => x.num === sorteo);
        if (s) win = s.win;
    }
    if (slice.length === 0 && pBase) slice = pBase.nums;

    let reduced = uv(k);
    let combos = win ? rv(slice, win, reduced, id) : generateWheelingWithFilters(slice, reduced, id);
    let txt = combos.map((c, i) => String(i + 1).padStart(4, '0') + ': ' + c.map(n => String(n).padStart(2, '0')).join('-')).join('\n');
    
    let ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
        let successful = document.execCommand('copy');
        if (successful) {
            showToast('Wheeling copiado');
        } else {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(txt).then(() => {
                    showToast('Wheeling copiado');
                }).catch(err => {
                    showToast('No se pudo copiar: ' + err);
                });
            } else {
                showToast('Error al copiar al portapapeles');
            }
        }
    } catch (err) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt).then(() => {
                showToast('Wheeling copiado');
            }).catch(e => {
                showToast('Error al copiar: ' + e.message);
            });
        } else {
            showToast('Error al copiar: ' + err.message);
        }
    }
    document.body.removeChild(ta);
}

function fallbackCopy(txt) {
    let ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
        let successful = document.execCommand('copy');
        alert(successful ? 'Copiado al portapapeles' : 'Error al copiar');
    } catch (err) {
        alert('Error al copiar: ' + err.message);
    }
    document.body.removeChild(ta);
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.keyCode === 27) {
        closeModal();
    }
});

init();
